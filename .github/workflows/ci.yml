name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Pi, so CI cannot pass on a version the Pi will not run.
          node-version: '20'
          cache: npm

      # lib/backup-script.test.ts runs the real backup script.
      - name: Install sqlite3
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Advisory, not blocking. There are 9 react-hooks errors that predate
      # the server migration, in files this work did not touch; failing every
      # PR on inherited debt would only teach people to ignore the badge.
      # Findings still show in the log. Make this blocking once it is clean.
      - name: Lint
        run: npm run lint
        continue-on-error: true
